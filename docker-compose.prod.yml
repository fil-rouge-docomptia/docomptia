services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_JWT_VALIDITY: ${APP_JWT_VALIDITY:-1h}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
    networks:
      facturation:
      proxy:
        aliases:
          - docomptia-prod-backend
    restart: always

  frontend:
    restart: always
    networks:
      facturation:
      proxy:
        aliases:
          - docomptia-prod-frontend

  ocr:
    restart: always

  postgres:
    restart: always

  minio:
    restart: always

networks:
  proxy:
    external: true
    name: proxy
