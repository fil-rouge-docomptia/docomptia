services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always

  frontend:
    restart: always

  ocr:
    restart: always

  postgres:
    restart: always

  minio:
    restart: always

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    networks:
      - facturation
