name: Create PR from staging to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: create-pr-from-staging-to-main
  cancel-in-progress: false

jobs:
  create-pr:
    name: Create PR from staging to main
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create pull request from staging to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main staging

          if [ "$(git rev-list --count origin/main..origin/staging)" -eq 0 ]; then
            echo "No staging commits to send to main."
            exit 0
          fi

          existing_pr_url="$(gh pr list \
            --base main \
            --head staging \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [ -n "$existing_pr_url" ]; then
            echo "A PR from staging to main already exists: $existing_pr_url"
            exit 0
          fi

          gh pr create \
            --base main \
            --head staging \
            --title "Merge staging into main" \
            --body "## Resume
          - Envoie les changements valides sur staging vers main.
          - La PR reste a relire et merger manuellement.

          ## Verification
          - Verifier que le deploiement staging est OK avant merge.
          - Verifier que la CI de cette PR est OK."
