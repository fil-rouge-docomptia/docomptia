name: Create PR from staging to main

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-pr-from-staging-to-main
  cancel-in-progress: false

jobs:
  prepare-pr:
    name: Prepare PR from staging to main
    runs-on: ubuntu-slim

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare pull request link from staging to main
        run: |
          git fetch origin main staging

          commits_to_send="$(git rev-list --count origin/main..origin/staging)"
          if [ "$commits_to_send" -eq 0 ]; then
            echo "No staging commits to send to main."
            {
              echo "## Create PR from staging to main"
              echo
              echo "No staging commits to send to main."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...staging?quick_pull=1"

          echo "Open this link to create the PR: $pr_url"
          {
            echo "## Create PR from staging to main"
            echo
            echo "$commits_to_send staging commit(s) can be sent to main."
            echo
            echo "[Open the PR from staging to main]($pr_url)"
            echo
            echo "The workflow does not create or merge the PR automatically."
          } >> "$GITHUB_STEP_SUMMARY"
