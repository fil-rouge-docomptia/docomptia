name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "KAN-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ocr-check:
    name: OCR service check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ocr/requirements.txt

      - name: Install OCR dependencies
        working-directory: ocr
        run: python -m pip install -r requirements.txt

      - name: Compile OCR Python code
        working-directory: ocr
        run: python -m compileall app

  docker-compose-check:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate dev compose config
        run: docker compose --env-file env/.env.dev -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Validate staging compose config
        run: docker compose --env-file env/.env.staging -f docker-compose.yml -f docker-compose.staging.yml config --quiet

      - name: Prepare prod env file
        run: cp env/.env.prod.example env/.env.prod

      - name: Validate prod compose config
        run: docker compose --env-file env/.env.prod -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  docker-images:
    name: Docker image build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - ocr-check
      - docker-compose-check
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: ocr
            context: ./ocr
            dockerfile: ./ocr/Dockerfile

    env:
      REGISTRY: ghcr.io
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
