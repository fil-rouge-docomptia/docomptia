name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run backend tests with Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend:/app" \
            -w /app \
            maven:3.9.11-eclipse-temurin-25 \
            mvn -B clean test

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ocr-tests:
    name: OCR tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ocr/requirements.txt

      - name: Install OCR dependencies
        working-directory: ocr
        run: python -m pip install --requirement requirements.txt

      - name: Run OCR tests
        working-directory: ocr
        run: python -m unittest discover -s tests -v

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate development configuration
        run: docker compose --env-file env/.env.dev -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Validate staging configuration
        run: docker compose --env-file env/.env.staging.example -f docker-compose.yml -f docker-compose.staging.yml config --quiet

      - name: Validate production configuration
        run: docker compose --env-file env/.env.prod.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet