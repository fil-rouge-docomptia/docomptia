name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "KAN-*"
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ocr-check:
    name: OCR service check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ocr/requirements.txt

      - name: Install OCR dependencies
        working-directory: ocr
        run: python -m pip install -r requirements.txt

      - name: Compile OCR Python code
        working-directory: ocr
        run: python -m compileall app

  docker-compose-check:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate dev compose config
        run: docker compose --env-file env/.env.dev -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Validate staging compose config
        run: docker compose --env-file env/.env.staging -f docker-compose.yml -f docker-compose.staging.yml config --quiet

      - name: Prepare prod env file
        run: cp env/.env.prod.example env/.env.prod

      - name: Validate prod compose config
        run: docker compose --env-file env/.env.prod -f docker-compose.yml -f docker-compose.prod.yml config --quiet
