services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: staging
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_JWT_VALIDITY: ${APP_JWT_VALIDITY:-1h}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
    networks:
      facturation:
      proxy:
        aliases:
          - docomptia-staging-backend
    restart: unless-stopped

  frontend:
    restart: unless-stopped
    networks:
      facturation:
      proxy:
        aliases:
          - docomptia-staging-frontend

  ocr:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  minio:
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: proxy
