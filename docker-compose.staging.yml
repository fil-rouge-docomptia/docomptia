services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: staging
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  ocr:
    restart: unless-stopped

  ollama:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  minio:
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - facturation
