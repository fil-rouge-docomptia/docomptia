spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgres.sql
      data-locations: classpath:data-postgres.sql

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  ocr:
    mock: ${APP_OCR_MOCK:false}
    base-url: ${APP_OCR_BASE_URL}
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    s3:
      endpoint: ${APP_STORAGE_S3_ENDPOINT}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY}
      bucket: ${APP_STORAGE_S3_BUCKET}
