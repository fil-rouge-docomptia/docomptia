spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgres.sql,classpath:db/migration/V344__create_supplier_accounts.sql,classpath:db/migration/V364__add_invoice_origin.sql,classpath:db/migration/V377__add_post_ocr_processing_errors.sql,classpath:db/migration/V386__add_accounting_journals_and_entry_exports.sql
      data-locations: classpath:data-postgres.sql

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    validity: ${APP_JWT_VALIDITY:1h}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  ocr:
    mock: ${APP_OCR_MOCK:false}
    base-url: ${APP_OCR_BASE_URL}
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    s3:
      endpoint: ${APP_STORAGE_S3_ENDPOINT}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY}
      bucket: ${APP_STORAGE_S3_BUCKET}
