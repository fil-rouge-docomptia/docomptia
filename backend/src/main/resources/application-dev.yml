spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/facturation}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:facturation}
    password: ${SPRING_DATASOURCE_PASSWORD:facturation}
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgres.sql,classpath:db/migration/V344__create_supplier_accounts.sql,classpath:db/migration/V347__link_supplier_accounts_to_accounting_entry_lines.sql
      data-locations: classpath:data-postgres.sql

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ocr:
    mock: ${APP_OCR_MOCK:false}
    base-url: ${APP_OCR_BASE_URL:http://localhost:8000}
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    s3:
      endpoint: ${APP_STORAGE_S3_ENDPOINT:http://localhost:9000}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:minioadmin}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:minioadmin}
      bucket: ${APP_STORAGE_S3_BUCKET:invoice-files}
